<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>草稿画板</title>
<style>
  :root {
    --bg-grouped: #E9E9EE;
    --frost: rgba(255,255,255,.78);
    --ink: #1C1C1E;
    --ink2: #6E6E73;
    --ink3: #AEAEB2;
    --blue: #007AFF;
    --blue-dark: #0066D6;
    --sep: rgba(60,60,67,.12);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Text", "Segoe UI Variable", "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg-grouped);
    color: var(--ink); overflow: hidden;
  }

  .window { height: 100vh; display: flex; flex-direction: column; }

  .titlebar {
    flex: none; display: flex; align-items: center; gap: 14px;
    padding: 12px 16px; background: var(--frost);
    backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--sep);
  }
  .title { font-size: 17px; font-weight: 700; }
  #save {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    background: var(--blue); color: #fff; border: none; cursor: pointer;
    font-size: 14px; font-weight: 600; padding: 8px 18px; border-radius: 10px;
    font-family: inherit;
  }
  #save:hover { background: var(--blue-dark); }

  .canvas-area { flex: 1; position: relative; min-height: 0; background: var(--bg-grouped); }
  canvas#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  canvas#cv.fit { margin: auto; }
  .canvas-area.dropping::after {
    content: ""; position: absolute; inset: 10px; border: 2px dashed var(--blue);
    border-radius: 14px; pointer-events: none;
  }

  .rail {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 84px; max-height: calc(100% - 28px); overflow-y: auto;
    background: var(--frost); backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,.6); border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.10);
    padding: 10px 8px; display: flex; flex-direction: column; gap: 3px; z-index: 10;
  }
  .tool {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: transparent; border: none; border-radius: 10px;
    padding: 7px 2px 5px; cursor: pointer; font-family: inherit;
  }
  .tool svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tool span { font-size: 11px; color: var(--ink2); }
  .tool:hover { background: rgba(0,0,0,.05); }
  .tool[aria-pressed="true"] { background: var(--blue); }
  .tool[aria-pressed="true"] svg { stroke: #fff; }
  .tool[aria-pressed="true"] span { color: #fff; }
  .rail .rule { height: 1px; background: var(--sep); margin: 6px 4px; flex: none; }
  .rail-label { font-size: 10px; color: var(--ink3); text-align: center; margin: 2px 0; letter-spacing: .05em; }
  .swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; justify-items: center; padding: 2px 0; }
  .sw { width: 23px; height: 23px; border-radius: 50%; border: none; cursor: pointer;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--blue); }
  .bgd { width: 19px; height: 19px; }
  .sizes { display: flex; justify-content: center; gap: 8px; padding: 3px 0; }
  .sz { width: 28px; height: 28px; display: grid; place-items: center; border: none; background: transparent; border-radius: 8px; cursor: pointer; }
  .sz:hover { background: rgba(0,0,0,.05); }
  .sz[aria-pressed="true"] { background: rgba(0,122,255,.14); }
  .sz i { display: block; border-radius: 50%; background: var(--ink); }

  .prompt-box {
    position: absolute; top: 12px; right: 14px; width: 216px; height: 216px;
    border: 1px solid var(--sep); border-radius: 12px; z-index: 10;
    background: var(--frost); backdrop-filter: blur(20px) saturate(180%);
    resize: none; outline: none; padding: 9px;
    font: inherit; font-size: 13px; line-height: 1.5; color: var(--ink);
    box-shadow: 0 8px 24px rgba(0,0,0,.10);
  }
  .prompt-box:focus { border-color: var(--blue); }
  .prompt-box::placeholder { color: var(--ink3); }

  :is(button, .sw):focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(28,28,30,.45); backdrop-filter: blur(8px); z-index: 50;
  }
  .overlay.on { display: flex; }
  .overlay .card {
    background: #fff; border-radius: 20px; padding: 34px 44px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.3); max-width: 420px;
  }
  .overlay .ok { width: 54px; height: 54px; border-radius: 50%; background: #34C759; color: #fff;
                 display: grid; place-items: center; font-size: 28px; margin: 0 auto 14px; }
  .overlay h2 { font-size: 18px; margin-bottom: 8px; }
  .overlay p { font-size: 13px; color: var(--ink2); line-height: 1.7; }
  .overlay p code { font-family: Consolas, monospace; font-size: 12px; background: rgba(0,0,0,.06); padding: 1px 6px; border-radius: 5px; }
  #ovBtns { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
  #ovBtns button { font: inherit; font-size: 14px; padding: 10px; border-radius: 10px; cursor: pointer; border: none; }
  #ovBtns .primary { background: var(--blue); color: #fff; font-weight: 600; }
  #ovBtns .primary:hover { background: var(--blue-dark); }
  #ovBtns .ghost { background: rgba(0,0,0,.05); color: var(--ink2); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="title">草稿画板</div>
    <button id="save">导出</button>
  </div>

  <div class="canvas-area" id="area">
    <canvas id="cv"></canvas>
    <textarea id="prompt" class="prompt-box" placeholder="描述你想要的效果…"></textarea>

    <aside class="rail" aria-label="绘图工具">
      <button class="tool" id="pen" aria-pressed="true" title="画笔">
        <svg viewBox="0 0 24 24"><path d="M17 3l4 4L8 20l-5 1 1-5L17 3z"/><path d="M14.5 5.5l4 4"/></svg><span>画笔</span>
      </button>
      <button class="tool" id="eraser" aria-pressed="false" title="橡皮擦">
        <svg viewBox="0 0 24 24"><path d="M20 20H9l-5.2-5.2a1.8 1.8 0 010-2.6L12 4a1.8 1.8 0 012.6 0l5.4 5.4a1.8 1.8 0 010 2.6L14 18"/><path d="M8.5 8.5l7 7"/></svg><span>橡皮擦</span>
      </button>
      <div class="rule"></div>
      <button class="tool" id="undo" title="撤销 (Ctrl+Z)">
        <svg viewBox="0 0 24 24"><path d="M8 5L3 10l5 5"/><path d="M3 10h11a6 6 0 016 6v2"/></svg><span>撤销</span>
      </button>
      <button class="tool" id="redo" title="重做 (Ctrl+Y)">
        <svg viewBox="0 0 24 24"><path d="M16 5l5 5-5 5"/><path d="M21 10H10a6 6 0 00-6 6v2"/></svg><span>重做</span>
      </button>
      <button class="tool" id="clear" title="清空画布">
        <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6.5 7l1 13h9l1-13"/></svg><span>删除</span>
      </button>
      <div class="rule"></div>
      <div class="rail-label">笔迹颜色</div>
      <div class="swatches" id="colors">
        <button class="sw" data-c="#1C1C1E" aria-pressed="true"  style="background:#1C1C1E" title="黑"></button>
        <button class="sw" data-c="#FFFFFF" aria-pressed="false" style="background:#fff" title="白"></button>
        <button class="sw" data-c="#FF3B30" aria-pressed="false" style="background:#FF3B30" title="红"></button>
        <button class="sw" data-c="#007AFF" aria-pressed="false" style="background:#007AFF" title="蓝"></button>
        <button class="sw" data-c="#34C759" aria-pressed="false" style="background:#34C759" title="绿"></button>
        <button class="sw" data-c="#FF9500" aria-pressed="false" style="background:#FF9500" title="橙"></button>
      </div>
      <div class="rule"></div>
      <div class="rail-label">粗细</div>
      <div class="sizes" id="sizes">
        <button class="sz" data-w="4"  aria-pressed="false" title="细"><i style="width:4px;height:4px"></i></button>
        <button class="sz" data-w="8"  aria-pressed="true"  title="中"><i style="width:8px;height:8px"></i></button>
        <button class="sz" data-w="16" aria-pressed="false" title="粗"><i style="width:15px;height:15px"></i></button>
      </div>
      <div class="rule"></div>
      <div class="rail-label">画布底色</div>
      <div class="swatches" id="bgs">
        <button class="sw bgd" data-c="#FFFFFF" aria-pressed="true"  style="background:#fff" title="白色"></button>
        <button class="sw bgd" data-c="#F2F2F7" aria-pressed="false" style="background:#F2F2F7" title="浅灰"></button>
        <button class="sw bgd" data-c="#FAF3E7" aria-pressed="false" style="background:#FAF3E7" title="米色"></button>
        <button class="sw bgd" data-c="#1C1C1E" aria-pressed="false" style="background:#1C1C1E" title="黑色"></button>
      </div>
      <div class="rule"></div>
      <button class="tool" id="importBtn" title="导入图片（可圈注后交付）">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.7"/><path d="M4 18l5-5 3.5 3.5L16 13l4 4.5"/></svg><span>导入</span>
      </button>
    </aside>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <div class="ok" id="ovIcon">✓</div>
    <h2 id="ovTitle">已交付给 Agent</h2>
    <p id="ovText"></p>
    <div id="ovBtns"></div>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>

<script>
const $ = id => document.getElementById(id);
const area = $('area'), cv = $('cv'), ctx = cv.getContext('2d');
const ink = document.createElement('canvas');
const ictx = ink.getContext('2d');
ictx.lineCap = ictx.lineJoin = 'round';

let bg = '#FFFFFF', imgEl = null;
let drawing = false, eraser = false, color = '#1C1C1E', width = 8;
const SESSION = (d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}-${String(d.getMinutes()).padStart(2,'0')}-${String(d.getSeconds()).padStart(2,'0')}`)(new Date());
let last = null, lastMid = null, inkDirty = false;
const undoStack = [], redoStack = [];
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

const r16 = v => Math.max(64, Math.min(3840, Math.round(v / 16) * 16));
function resizeCanvas(w, h) {
  if (cv.width === w && cv.height === h) return;
  const oldInk = document.createElement('canvas');
  oldInk.width = ink.width || w; oldInk.height = ink.height || h;
  if (ink.width) oldInk.getContext('2d').drawImage(ink, 0, 0);
  cv.width = w; cv.height = h; ink.width = w; ink.height = h;
  ictx.lineCap = ictx.lineJoin = 'round';
  ictx.drawImage(oldInk, 0, 0, w, h);
  render();
}
function fitBlank() {
  cv.classList.remove('fit');
  cv.style.width = ''; cv.style.height = '';
  const r = area.getBoundingClientRect();
  resizeCanvas(r16(r.width), r16(r.height));
  render();
}
function fitPhoto() {
  resizeCanvas(r16(Math.min(imgEl.width, 3840)), r16(Math.min(imgEl.height, 3840)));
  cv.classList.add('fit');
  const r = area.getBoundingClientRect();
  const s = Math.min(r.width / cv.width, r.height / cv.height);
  cv.style.width = Math.round(cv.width * s) + 'px';
  cv.style.height = Math.round(cv.height * s) + 'px';
  render();
}
function syncCanvas() { imgEl ? fitPhoto() : fitBlank(); }

function render() {
  ctx.fillStyle = bg; ctx.fillRect(0, 0, cv.width, cv.height);
  if (imgEl) ctx.drawImage(imgEl, 0, 0, cv.width, cv.height);
  ctx.drawImage(ink, 0, 0);
}
let rsTimer = null;
window.addEventListener('resize', () => { clearTimeout(rsTimer); rsTimer = setTimeout(syncCanvas, 200); });

const pos = e => {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height };
};
cv.addEventListener('pointerdown', e => {
  snapshot(); drawing = true; inkDirty = true; cv.setPointerCapture(e.pointerId);
  last = lastMid = pos(e);
  if (eraser) { wipeSeg(last, last); } else {
    ictx.beginPath(); ictx.arc(last.x, last.y, width / 2, 0, Math.PI * 2);
    ictx.fillStyle = color; ictx.fill();
  }
  render();
});
function wipeSeg(a, b) {
  ictx.globalCompositeOperation = 'destination-out';
  ictx.strokeStyle = '#000'; ictx.lineWidth = width * 4; ictx.lineCap = 'round';
  ictx.beginPath(); ictx.moveTo(a.x, a.y); ictx.lineTo(b.x + .01, b.y + .01); ictx.stroke();
  ictx.globalCompositeOperation = 'source-over';
}
cv.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = pos(e), m = mid(last, p);
  if (eraser) wipeSeg(lastMid, p);
  else {
    ictx.strokeStyle = color; ictx.lineWidth = width;
    ictx.beginPath(); ictx.moveTo(lastMid.x, lastMid.y);
    ictx.quadraticCurveTo(last.x, last.y, m.x, m.y); ictx.stroke();
  }
  last = p; lastMid = m; render();
});
cv.addEventListener('pointerup', () => { if (drawing) { drawing = false; last = lastMid = null; } });

function capture() { return { bg, img: imgEl ? imgEl.src : null, ink: inkDirty ? ink.toDataURL() : null }; }
function snapshot() { undoStack.push(capture()); redoStack.length = 0; if (undoStack.length > 25) undoStack.shift(); }
function applyState(st) {
  bg = st.bg;
  let pending = 1;
  const done = () => { if (--pending === 0) { render(); } };
  imgEl = null;
  if (st.ink) {
    pending++;
    const im = new Image();
    im.onload = () => { ictx.clearRect(0, 0, ink.width, ink.height); ictx.drawImage(im, 0, 0, ink.width, ink.height); inkDirty = true; done(); };
    im.src = st.ink;
  } else { ictx.clearRect(0, 0, ink.width, ink.height); inkDirty = false; }
  if (st.img) {
    pending++;
    const im = new Image();
    im.onload = () => { imgEl = im; done(); };
    im.src = st.img;
  }
  done();
}
function undo() { if (!undoStack.length) return; redoStack.push(capture()); applyState(undoStack.pop()); }
function redo() { if (!redoStack.length) return; undoStack.push(capture()); applyState(redoStack.pop()); }
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) { e.preventDefault(); redo(); }
});

function importFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const rd = new FileReader();
  rd.onload = () => {
    snapshot();
    const im = new Image();
    im.onload = () => { imgEl = im; syncCanvas(); };
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
}
$('importBtn').onclick = () => $('file').click();
$('file').onchange = e => { importFile(e.target.files[0]); e.target.value = ''; };
area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('dropping'); });
area.addEventListener('dragleave', () => area.classList.remove('dropping'));
area.addEventListener('drop', e => { e.preventDefault(); area.classList.remove('dropping'); importFile(e.dataTransfer.files[0]); });
window.addEventListener('paste', e => {
  for (const it of e.clipboardData.items) if (it.type.startsWith('image/')) { importFile(it.getAsFile()); break; }
});

const pressed = (el, on) => el.setAttribute('aria-pressed', String(on));
$('pen').onclick = () => { eraser = false; pressed($('pen'), true); pressed($('eraser'), false); };
$('eraser').onclick = () => { eraser = true; pressed($('eraser'), true); pressed($('pen'), false); };
document.querySelectorAll('#colors .sw').forEach(s => s.onclick = () => {
  color = s.dataset.c; eraser = false; pressed($('pen'), true); pressed($('eraser'), false);
  document.querySelectorAll('#colors .sw').forEach(x => pressed(x, false)); pressed(s, true);
});
document.querySelectorAll('#bgs .sw').forEach(s => s.onclick = () => {
  snapshot(); bg = s.dataset.c;
  document.querySelectorAll('#bgs .sw').forEach(x => pressed(x, false)); pressed(s, true);
  render();
});
document.querySelectorAll('#sizes .sz').forEach(b => b.onclick = () => {
  width = +b.dataset.w;
  document.querySelectorAll('#sizes .sz').forEach(x => pressed(x, false)); pressed(b, true);
});
$('undo').onclick = undo; $('redo').onclick = redo;
$('clear').onclick = () => {
  snapshot(); ictx.clearRect(0, 0, ink.width, ink.height);
  bg = '#FFFFFF'; imgEl = null; inkDirty = false;
  document.querySelectorAll('#bgs .sw').forEach(x => pressed(x, x.dataset.c === '#FFFFFF'));
  fitBlank(); render();
};

const promptEl = $('prompt');
promptEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); deliver(); } });
fitBlank();

const overlay = $('overlay');
function showOverlay(icon, title, text) {
  $('ovIcon').textContent = icon; $('ovTitle').textContent = title; $('ovText').innerHTML = text;
  overlay.classList.add('on');
}
const crcTable = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(buf) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) crc = crcTable[(crc ^ buf[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function withPromptChunk(pngBlob, text) {
  return pngBlob.arrayBuffer().then(buf => {
    const src = new Uint8Array(buf), enc = new TextEncoder();
    const kw = enc.encode('Description'), txt = enc.encode(text);
    const data = new Uint8Array(kw.length + 5 + txt.length);
    data.set(kw);
    data[kw.length] = 0; data[kw.length + 1] = 0; data[kw.length + 2] = 0; data[kw.length + 3] = 0; data[kw.length + 4] = 0;
    data.set(txt, kw.length + 5);
    const iend = src.length - 12;
    const out = new Uint8Array(src.length + 12 + data.length);
    out.set(src.subarray(0, iend));
    new DataView(out.buffer).setUint32(iend, data.length);
    const type = enc.encode('iTXt');
    out.set(type, iend + 4); out.set(data, iend + 8);
    const crcBuf = new Uint8Array(4 + data.length);
    crcBuf.set(type, 0); crcBuf.set(data, 4);
    new DataView(out.buffer).setUint32(iend + 8 + data.length, crc32(crcBuf));
    out.set(src.subarray(iend), iend + 12 + data.length);
    return new Blob([out], { type: 'image/png' });
  });
}
function closeTab() {
  setTimeout(() => window.close(), 600);
  setTimeout(() => { try { window.open('', '_self').close(); } catch (e) {} }, 900);
}
async function deliver() {
  if (!imgEl && !inkDirty) { alert('画布是空的：先画几笔或导入图片再导出'); return; }
  render();
  const pngBlob = await new Promise(res => cv.toBlob(res, 'image/png'));
  const finalBlob = await withPromptChunk(pngBlob, promptEl.value.trim());
  const desc = promptEl.value.trim();
  try {
    const b64 = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(finalBlob); });
    const r = await fetch('http://127.0.0.1:17841/deliver', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: SESSION, prompt: desc, png: b64 })
    });
    if (!r.ok) throw new Error(await r.text());
    fetch('http://127.0.0.1:17841/shutdown', { method: 'POST' }).catch(() => {});
    closeTab();
    setTimeout(() => showOverlay('✓', '已保存到 GPT-Image/sketch_io/' + SESSION + '/', 'Agent 会自动拾取并生成，本页可关闭。'), 100);
    return;
  } catch (e) {}
  const url = URL.createObjectURL(finalBlob);
  const a = document.createElement('a');
  a.download = `sketch_${SESSION}.png`; a.href = url; a.click();
  closeTab();
  setTimeout(() => showOverlay('✓', '已导出，Agent 会自动拾取并生成，本页可关闭。'), 700);
}
$('save').onclick = deliver;
</script>
</body>
</html>
